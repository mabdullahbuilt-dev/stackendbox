name: Encrypted offsite backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'
permissions:
  contents: read
concurrency:
  group: stackendbox-encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.STACKENDBOX_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Encrypted database and storage export to private Drive
        run: node scripts/portal-offsite-backup.mjs
        env:
          BACKUP_DATABASE_URL: ${{ secrets.STACKENDBOX_BACKUP_DATABASE_URL }}
          BACKUP_SUPABASE_SECRET_KEY: ${{ secrets.STACKENDBOX_BACKUP_SUPABASE_SECRET_KEY }}
          BACKUP_PUBLIC_KEY: ${{ secrets.STACKENDBOX_BACKUP_PUBLIC_KEY }}
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.STACKENDBOX_BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.STACKENDBOX_BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.STACKENDBOX_BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_FOLDER_ID: '1myfe2U3XTBILqOVp77dTbSMDGwRkUj7m'
